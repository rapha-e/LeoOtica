version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: leootica_db
    restart: always
    environment:
      POSTGRES_USER: leouser
      POSTGRES_PASSWORD: leopassword
      POSTGRES_DB: leootica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro


volumes:
  postgres_data:
